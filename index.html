
<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀収支管理</title>
<style>
body{font-family:Meiryo,sans-serif;background:#f5f5f5;padding:20px}
.card{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ccc;padding:4px;text-align:center}
th{background:#1976d2;color:#fff}
input,select{padding:4px}
.ok{color:green;font-weight:bold}.ng{color:red;font-weight:bold}
</style></head><body>

<div class="card">
人数<select id="playerCount" onchange="calc()"><option value="4">4麻</option><option value="3">3麻</option></select>
返し点<input id="returnPoint" type="number" value="30000" onchange="calc()">
ウマ<select id="uma" onchange="calc()"><option value="10-20">10-20</option><option value="5-10">5-10</option><option value="none">なし</option></select>
チップ倍率<input id="chipRate" type="number" value="2" onchange="calc()">
</div>

<div class="card">
A<input id="nameA" value="A" oninput="updateNames()">
B<input id="nameB" value="B" oninput="updateNames()">
C<input id="nameC" value="C" oninput="updateNames()">
D<input id="nameD" value="D" oninput="updateNames()">
</div>

<div class="card">
<table>
<thead>
<tr>
<th>No</th>
<th id="hA">A点数</th><th>A順位</th><th>A収支</th>
<th id="hB">B点数</th><th>B順位</th><th>B収支</th>
<th id="hC">C点数</th><th>C順位</th><th>C収支</th>
<th id="hD">D点数</th><th>D順位</th><th>D収支</th>
<th>合計</th><th>チェック</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>

<div class="card">
<h3>チップ最終枚数</h3>
<table>
<tr><th id="cna">A</th><th id="cnb">B</th><th id="cnc">C</th><th id="cnd">D</th><th>チェック</th></tr>
<tr>
<td><input id="chipA" type="number" value="0" onchange="calc()"></td>
<td><input id="chipB" type="number" value="0" onchange="calc()"></td>
<td><input id="chipC" type="number" value="0" onchange="calc()"></td>
<td><input id="chipD" type="number" value="0" onchange="calc()"></td>
<td id="chipCheck">OK</td>
</tr>
</table>
</div>

<div class="card">
<table>
<tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr>
<tr><td>半荘収支</td><td id="gA"></td><td id="gB"></td><td id="gC"></td><td id="gD"></td></tr>
<tr><td>チップ収支</td><td id="cA"></td><td id="cB"></td><td id="cC"></td><td id="cD"></td></tr>
<tr><td>総合計</td><td id="tA"></td><td id="tB"></td><td id="tC"></td><td id="tD"></td></tr>
</table>
</div>

<script>
const body=document.getElementById('body');

const hA=document.getElementById('hA');
const hB=document.getElementById('hB');
const hC=document.getElementById('hC');
const hD=document.getElementById('hD');

const cna=document.getElementById('cna');
const cnb=document.getElementById('cnb');
const cnc=document.getElementById('cnc');
const cnd=document.getElementById('cnd');

const nameA=document.getElementById('nameA');
const nameB=document.getElementById('nameB');
const nameC=document.getElementById('nameC');
const nameD=document.getElementById('nameD');

const playerCount=document.getElementById('playerCount');
const returnPoint=document.getElementById('returnPoint');

const chipA=document.getElementById('chipA');
const chipB=document.getElementById('chipB');
const chipC=document.getElementById('chipC');
const chipD=document.getElementById('chipD');

const chipRate=document.getElementById('chipRate');
const chipCheck=document.getElementById('chipCheck');


for(let i=1;i<=10;i++){
body.innerHTML+=`<tr>
<td>${i}</td>
<td><input class=sA type=number onchange=calc()></td><td class=rA></td><td class=pA></td>
<td><input class=sB type=number onchange=calc()></td><td class=rB></td><td class=pB></td>
<td><input class=sC type=number onchange=calc()></td><td class=rC></td><td class=pC></td>
<td><input class=sD type=number onchange=calc()></td><td class=rD></td><td class=pD></td>
<td class=sum></td><td class=chk></td></tr>`;
}
function updateNames(){
let a=nameA.value||'A',b=nameB.value||'B',c=nameC.value||'C',d=nameD.value||'D';
hA.textContent=a+'点数';hB.textContent=b+'点数';hC.textContent=c+'点数';hD.textContent=d+'点数';
cna.textContent=a;cnb.textContent=b;cnc.textContent=c;cnd.textContent=d;
}
function uma(rank){let u=umaSel.value;if(u==='10-20')return[20,10,-10,-20][rank];if(u==='5-10')return[10,5,-5,-10][rank];return 0;}
function roundMah(v){let s=v>=0?1:-1;v=Math.abs(v);let t=Math.floor(v/1000),r=v%1000;return s*(r>=600?t+1:t);}
function fmt(n){return n>0?'+'+n:n;}


function calc(){
let totals=[0,0,0,0],pc=+playerCount.value,ret=+returnPoint.value;

document.querySelectorAll('#body tr').forEach(row=>{
let scores=[+(row.querySelector('.sA').value||0),+(row.querySelector('.sB').value||0),+(row.querySelector('.sC').value||0),+(row.querySelector('.sD').value||0)];
if(pc===3)scores[3]=0;
if(scores.every(x=>x===0))return;

let total=scores.reduce((a,b)=>a+b,0),exp=pc===4?100000:90000;
let chk=row.querySelector('.chk');
chk.textContent=(total===exp?'OK':'❌');
chk.className=(total===exp?'ok chk':'ng chk');

row.querySelector('.sum').textContent=total;

let sorted=scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
let ranks=[0,0,0,0];sorted.forEach((p,i)=>ranks[p.i]=i+1);

let res=[0,0,0,0];
for(let r=1;r<sorted.length;r++){let p=sorted[r];res[p.i]=roundMah(p.s-ret)+uma(r);}
res[sorted[0].i]=-res.reduce((a,b)=>a+b,0);

['A','B','C','D'].forEach((x,i)=>{
row.querySelector('.r'+x).textContent=ranks[i];
row.querySelector('.p'+x).textContent=fmt(res[i]);
});
totals=totals.map((v,i)=>v+res[i]);
});

let chips=[+chipA.value,+chipB.value,+chipC.value,+chipD.value];
let chipSum=chips.reduce((a,b)=>a+b,0);
chipCheck.textContent=chipSum===0?'OK':'❌';
chipCheck.className=chipSum===0?'ok':'ng';

let chipRes=chips.map(x=>x*(+chipRate.value));
let final=totals.map((v,i)=>v+chipRes[i]);

['A','B','C','D'].forEach((x,i)=>{
document.getElementById('g'+x).textContent=fmt(totals[i]);
document.getElementById('c'+x).textContent=fmt(chipRes[i]);
document.getElementById('t'+x).textContent=fmt(final[i]);
});
}
updateNames();calc();
</script>
</body></html>
